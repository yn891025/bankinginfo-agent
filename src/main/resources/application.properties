spring.application.name=department-guide-agent
server.port=8080
spring.jackson.default-property-inclusion=non_null
debug=false

# 배치 에이전트 MCP 연동(Control-M 수행 이력). 비활성화 시 resources/batch/*.csv 를 사용합니다.
# 툴 결과는 기존 CSV와 같은 컬럼의 CSV 텍스트 또는 JSON 행 배열이어야 합니다.
batch.mcp.enabled=${BATCH_MCP_ENABLED:false}
batch.mcp.url=${BATCH_MCP_URL:http://localhost:3000/mcp}
batch.mcp.tool=${BATCH_MCP_TOOL:get_batch_run_status}
batch.mcp.odate-argument=odate
batch.mcp.auth-token=${BATCH_MCP_TOKEN:}
batch.mcp.timeout=10s
batch.mcp.cache-ttl=15s
